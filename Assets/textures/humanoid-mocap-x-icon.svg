<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 128 128" fill="none">
  <title>Humanoid Mocap X</title>
  <desc>A white figure spread in an X, with gold joint markers and captured fingers at both hands, inside the circular capture guide of Humanoid Mocap on a dark rounded square.</desc>
  <rect width="128" height="128" rx="25" fill="#19191F"/>

  <!-- Broken circular guide and cardinal marks, as in Humanoid Mocap. -->
  <g stroke="#606168" stroke-width="1.5" stroke-linecap="round">
    <path d="M15 46A52 52 0 0 1 46 15"/>
    <path d="M82 15A52 52 0 0 1 113 46"/>
    <path d="M113 82A52 52 0 0 1 82 113"/>
    <path d="M46 113A52 52 0 0 1 15 82"/>
  </g>
  <g stroke="#FFBE36" stroke-width="1.8" stroke-linecap="round">
    <path d="M64 7V13M64 115V121M7 64H13M115 64H121"/>
  </g>

  <!-- Spine, shoulders, hips and the four limbs spread in an X. -->
  <g stroke="#F4F4F5" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M64 40L64 53L64 66"/>
    <path d="M54 43L64 40L74 43"/>
    <path d="M57 68L64 66L71 68"/>
    <path d="M54 43L46 36L39 30"/>
    <path d="M74 43L82 36L89 30"/>
    <path d="M57 68L50 84L42 99"/>
    <path d="M71 68L78 84L86 99"/>
  </g>

  <!-- Captured fingers: each hand's fingers and thumb. -->
  <g stroke="#F4F4F5" stroke-width="1.6" stroke-linecap="round">
    <path d="M39 30L34 24M39 30L32 27M39 30L36 22M39 30L32 32"/>
    <path d="M89 30L94 24M89 30L96 27M89 30L92 22M89 30L96 32"/>
  </g>

  <!-- Gold markers on the captured joints. -->
  <g fill="#FFBE36">
    <circle cx="64" cy="40" r="2.8"/>
    <circle cx="64" cy="53" r="2.6"/>
    <circle cx="64" cy="66" r="2.8"/>
    <circle cx="54" cy="43" r="2.8"/>
    <circle cx="74" cy="43" r="2.8"/>
    <circle cx="46" cy="36" r="2.6"/>
    <circle cx="82" cy="36" r="2.6"/>
    <circle cx="57" cy="68" r="2.8"/>
    <circle cx="71" cy="68" r="2.8"/>
    <circle cx="50" cy="84" r="2.6"/>
    <circle cx="78" cy="84" r="2.6"/>
  </g>
  <g fill="#F4F4F5">
    <circle cx="64" cy="29" r="6.5"/>
    <circle cx="39" cy="30" r="3.1"/>
    <circle cx="89" cy="30" r="3.1"/>
    <circle cx="42" cy="99" r="3.1"/>
    <circle cx="86" cy="99" r="3.1"/>
  </g>
</svg>
