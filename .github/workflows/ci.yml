name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: '19 7 * * 1'

permissions:
  contents: read

jobs:
  hosted-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: examples/hosted-web/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: examples/hosted-web
      - run: npm test
        working-directory: examples/hosted-web
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: humanoid-mocap-x
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: humanoid-mocap-x/global.json
      - run: dotnet run --project tests/MocapX.Tests.csproj --configuration Release
        working-directory: humanoid-mocap-x
